services:
  support-desk:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Leave OPENAI_API_KEY empty to run the built-in rule-based triage.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      DATABASE_URL: "sqlite:///./data/support_desk.db"
    volumes:
      - support-data:/app/data

volumes:
  support-data:
